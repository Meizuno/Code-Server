# Single compose file — the SAME command works identically on the laptop
# and on the VPS:
#   docker compose up -d --build
# (or pull the prebuilt image: docker compose pull && docker compose up -d)
services:
  code-server:
    image: ghcr.io/meizuno/code-server:latest
    build: .
    container_name: code-server

    # TRADE-OFF, stated plainly: running dockerd inside a container without
    # a host runtime like Sysbox requires the OUTER container to be
    # privileged. The inner daemon being rootless does NOT remove that need —
    # it only adds defense-in-depth (a breakout from the inner daemon lands
    # as unprivileged uid 1000, not root). Treat this container as
    # semi-trusted: gate it behind Cloudflare Access and keep the port on
    # loopback (both done below / in the README).
    privileged: true

    # Reduced-privilege alternative for hosts that allow unprivileged userns
    # nesting: comment out `privileged: true` above and uncomment the block
    # below. FRAGILE and host-dependent — breaks on kernels/distros that
    # restrict unprivileged user namespaces or need extra masked paths;
    # verify all acceptance checks after switching.
    # security_opt:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    #   - systempaths=unconfined
    # cap_add:
    #   - SYS_ADMIN
    # devices:
    #   - /dev/fuse   # fuse-overlayfs needs it (privileged mode exposes it implicitly)

    ports:
      # Loopback only — this is how you reach it on a LAPTOP
      # (http://localhost:8080). On the server it is NOT the ingress path:
      # cloudflared runs as a container, so a tunnel hostname of
      # http://localhost:8080 resolves to cloudflared's own loopback and never
      # reaches the host's published port. The tunnel uses the shared network
      # below instead.
      - "127.0.0.1:8080:8080"
    networks:
      # Own bridge, for egress: image pulls, git, npm.
      - default
      # Shared with cloudflared ONLY, so the tunnel can resolve this container
      # by name (point code.<domain> at http://code-server:8080).
      #
      # Deliberately NOT meizuno_edge. Attaching the sandbox to edge also gives
      # it Traefik, every application container, and a Grafana that runs with
      # anonymous admin and no login — reachable directly, which walks straight
      # around the Cloudflare Access policy in front of them. This network
      # carries cloudflared and nothing else.
      - tunnel
    volumes:
      # Code, VS Code settings/extensions, AND the rootless daemon's image
      # store (~/.local/share/docker) — one volume persists everything.
      - coder-home:/home/coder
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6g
          # NOTE: compose has no disk limit. The ceiling is the filesystem
          # under the volume — see `volumes:` below.
    restart: unless-stopped

networks:
  # Created by the production stack (compose.infra.yaml in the Infrastructure
  # repo), which is why it is external here: bring that up first, or this
  # project fails with "network meizuno_tunnel declared as external, but could
  # not be found". On a laptop with no production stack, delete the `tunnel`
  # entries above and reach code-server on 127.0.0.1:8080.
  tunnel:
    name: meizuno_tunnel
    external: true

volumes:
  # DISK CEILING. Docker's local driver cannot cap a volume's size on ext4, so
  # the cap is the filesystem itself: a fixed-size ext4 image, loop-mounted at
  # /srv/coder-home, which this volume binds to. The sandbox then physically
  # cannot exceed it — it gets ENOSPC while the host (and the production stack
  # sharing the same disk) carries on untouched. Inner build layers and images
  # had grown to 19 GB on a 99 GB disk shared with production before this.
  #
  # Create the backing filesystem ONCE with ./setup-coder-home.sh (it also
  # migrates an existing coder-home volume and adds the fstab entry). Without
  # it, `docker compose up` fails because /srv/coder-home does not exist —
  # deliberately loud rather than silently uncapped.
  #
  # Resize later: stop the container, then
  #   truncate -s 40G /var/lib/coder-home.img && e2fsck -f /var/lib/coder-home.img
  #   resize2fs /var/lib/coder-home.img
  coder-home:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/coder-home
